[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = [
    "https://conda.modular.com/max-nightly",
    "https://repo.prefix.dev/modular-community",
    "conda-forge",
]
name = "mojoapp-life-art"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
# Serialise against other benchmarks on the machine, but fail loudly instead of
# waiting forever if one of them is stuck holding the lock.
bench = """
flock -w 1800 /tmp/mojo-bench.lock python bench/bench.py || {
    echo "bench: another benchmark has held /tmp/mojo-bench.lock for 30 minutes" >&2
    exit 1
}
"""
demo = "python demo/make_demo.py"
showcase = "python showcase/mojosub.py"
# The mojojojo demo needs a key; without one it prints a skip and exits 0.
showcase-remote = "python showcase/mojojojo.py"
# Refresh the SHA-256 digests in tests/test_golden.py. Read the diff.
goldens = "python tests/record_goldens.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092905"
# `max` ships max.mojoc from <prefix>/lib/mojo. Without it the
# `from max.algorithm import parallelize` import fails, and the serial
# fallback is 14x slower on a 1024x1024 grid. Released in lockstep with mojo.
max = "==26.7.0.dev2026092905"
python = "3.13.*"
pytest = "*"
numpy = "*"
# pillow is a TEST dependency only. The encoders in python/mojoapp_life_art
# (png.py, gif.py) are hand-rolled and use nothing but zlib and struct, so a
# Pillow upgrade cannot change a byte of published output; Pillow is imported
# only to decode the GIFs in tests/test_api.py and tests/test_golden.py.
pillow = "*"

# mojosub and mojojojo are not on PyPI. Verified against the JSON API on the
# day this file was written: pypi.org/pypi/mojosub/json and
# pypi.org/pypi/mojojojo/json both return 404. Declaring them here would make
# `pixi install` fail for everyone, so they are not declared. The showcase
# scripts look for a local checkout via MOJOSUB_PATH / MOJOJOJO_PATH, then a
# plain import, and skip with a message naming the fix. Neither prints a
# speedup it did not measure.
[pypi-dependencies]